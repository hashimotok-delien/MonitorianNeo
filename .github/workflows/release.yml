name: Release MonitorianNeo

#
# 使い方:
#   1) タグ push でリリース: git tag v0.1.0 && git push origin v0.1.0
#   2) 手動実行（Actions > Release MonitorianNeo > Run workflow）でバージョンを入力
#
# 出力:
#   - MonitorianNeo-<version>.msi    … インストーラ（WiX・インストール先を選択可能／管理者権限不要）
#   - MonitorianNeo-win-x64.zip     … ポータブル版
#   - SHA256SUMS.txt
#
# このアプリは .NET Framework 4.8 の WPF アプリのため、dotnet publish ではなく MSBuild でビルドする。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（例: 0.1.0）'
        required: false
        type: string
      prerelease:
        description: 'プレリリースとして公開する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SOLUTION: MonitorianNeo/MonitorianNeo.sln
  APP_PROJECT: MonitorianNeo/Monitorian/Monitorian.csproj
  INSTALLER_PROJECT: MonitorianNeo/Installer/Installer.wixproj
  APP_OUTPUT: MonitorianNeo/Monitorian/bin/Release
  CONFIGURATION: Release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Determine version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            $version = $env:REF_NAME -replace '^v', ''
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION -replace '^v', ''
          }
          else {
            $version = '0.1.0'
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "不正なバージョンです: $version (例: 0.1.0 または 0.2.0-rc.1)"
          }

          # MSI の Version は x.y.z の数値のみ扱えるため、プレリリース表記を落とす
          $msiVersion = ($version -split '-')[0]

          "value=$version" >> $env:GITHUB_OUTPUT
          "msi=$msiVersion" >> $env:GITHUB_OUTPUT
          "tag=v$version"  >> $env:GITHUB_OUTPUT
          Write-Host "リリースバージョン: v$version (MSI: $msiVersion)"

      - name: 3. Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 4. Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild $env:SOLUTION -t:Restore -p:Configuration=$env:CONFIGURATION -v:m
          if ($LASTEXITCODE -ne 0) { throw 'NuGet パッケージの復元に失敗しました。' }

      - name: 5. Build app and create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild $env:APP_PROJECT -p:Configuration=$env:CONFIGURATION -v:m
          if ($LASTEXITCODE -ne 0) { throw 'アプリのビルドに失敗しました。' }

          if (-not (Test-Path (Join-Path $env:APP_OUTPUT 'MonitorianNeo.exe'))) {
            throw "MonitorianNeo.exe が見つかりません: $env:APP_OUTPUT"
          }

          $publishDir = 'dist\portable'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          Copy-Item -Path (Join-Path $env:APP_OUTPUT '*') -Destination $publishDir -Recurse -Force
          Copy-Item README.md $publishDir -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md $publishDir -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Compress-Archive -Path "$publishDir\*" -DestinationPath 'dist\MonitorianNeo-win-x64.zip' -Force
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: 6. Build installer (WiX)
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.version.outputs.msi }}
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild $env:INSTALLER_PROJECT `
            -p:Configuration=$env:CONFIGURATION `
            -p:Platform=x86 `
            "-p:ProductVersion=$env:MSI_VERSION" `
            -v:m
          if ($LASTEXITCODE -ne 0) { throw 'インストーラのビルドに失敗しました。' }

          $msi = Get-ChildItem 'MonitorianNeo\Installer\bin' -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msi) { throw 'インストーラー (.msi) が見つかりません。' }

          Copy-Item $msi.FullName "dist\MonitorianNeo-$env:MSI_VERSION.msi" -Force
          Get-Item "dist\MonitorianNeo-$env:MSI_VERSION.msi" | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: 7. Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(Get-ChildItem -Path 'dist\*.zip', 'dist\*.msi' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            throw 'チェックサム対象のファイルが見つかりません（ビルドに失敗しています）。'
          }

          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath 'dist\SHA256SUMS.txt' -Encoding ascii
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding ascii -Append
          Get-Content 'dist\SHA256SUMS.txt'

      - name: 8. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MonitorianNeo v${{ steps.version.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          body: |
            ## インストール

            下の `MonitorianNeo-${{ steps.version.outputs.msi }}.msi` を実行し、ウィザードに従ってください
            （インストール先は変更できます／管理者権限不要）。

            コマンドラインから入れる場合:

            ```powershell
            msiexec /i MonitorianNeo-${{ steps.version.outputs.msi }}.msi /qn
            ```

            **動作要件**: Windows 10 / 11（x64）と .NET Framework 4.8。
            Windows 10 1903 以降では .NET Framework 4.8 が標準で入っているため、追加のインストールは不要です。
            外付けモニターの明るさを調整するには、そのモニターで DDC/CI が有効になっている必要があります。

            ### ポータブル版

            インストーラを使わない場合は `MonitorianNeo-win-x64.zip` を展開し、そのまま `MonitorianNeo.exe` を実行してください。

            > このアプリはコード署名されていないため、SmartScreen の警告が表示される場合があります。

            `SHA256SUMS.txt` でダウンロードしたファイルを検証できます。

            変更内容の詳細は [CHANGELOG.md](https://github.com/hashimotok-delien/MonitorianNeo/blob/master/CHANGELOG.md) を参照してください。
          files: |
            dist/MonitorianNeo-*.msi
            dist/MonitorianNeo-win-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
